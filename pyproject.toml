[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "duotonics"
dynamic = ["dependencies", "version"]
description = "Reproducible duotone image processing with OpenCV and NumPy, available as a Python CLI, library, and tkinter GUI."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Michail Semoglou"},
]
keywords = ["duotone", "image-processing", "opencv", "numpy", "color"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: Image Processing",
]

[project.urls]
Homepage = "https://github.com/MichailSemoglou/duotonics"
Repository = "https://github.com/MichailSemoglou/duotonics"
Issues = "https://github.com/MichailSemoglou/duotonics/issues"
Changelog = "https://github.com/MichailSemoglou/duotonics/blob/main/CHANGELOG.md"

[project.scripts]
duotonics = "duotone_generator:main"

[tool.setuptools]
py-modules = ["duotone_generator"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}
version = {attr = "duotone_generator.__version__"}

[tool.coverage.run]
branch = true
source = ["duotone_generator"]

[tool.coverage.report]
show_missing = true
fail_under = 75
