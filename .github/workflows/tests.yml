name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  pytest:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            requirements-dev.txt

      - name: Install package and dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . -r requirements-dev.txt

      - name: Run tests
        run: pytest

      - name: Verify tkinter-free import
        # The module must import on headless systems with no tkinter.
        # Mapping the name to None in sys.modules makes any 'import tkinter'
        # raise ImportError.
        if: runner.os == 'Linux'
        run: python -c "import sys; sys.modules['tkinter'] = None; import duotone_generator"

  quality:
    name: Quality and security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            requirements-dev.txt
            requirements-quality.txt

      - name: Install package and quality tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . -r requirements-dev.txt -r requirements-quality.txt

      - name: Ruff
        run: ruff check .

      - name: mypy
        run: mypy duotone_generator.py

      - name: Bandit
        run: bandit -r duotone_generator.py

      - name: Dependency audit
        run: pip-audit

      - name: Coverage
        run: pytest --cov --cov-report=term-missing --cov-report=xml
