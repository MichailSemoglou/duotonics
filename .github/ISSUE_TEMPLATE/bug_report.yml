name: Bug report
description: Report incorrect or unexpected behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Duotonics version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: List the steps, command, or library call that produces the problem.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Actual and expected behavior
      description: Describe what happened and what you expected instead.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system and Python version
      placeholder: "macOS, Python 3.13"
    validations:
      required: true
